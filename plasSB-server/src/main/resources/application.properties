spring.application.name=plasSB-server
# Ecoembes usa el 8080; PlasSB tiene que usar otro puerto
server.port=8081
spring.output.ansi.enabled=ALWAYS


# Project persistence: database location.
# "file:" stores data on disk; "mem:" loses it when the process terminates.
# The path ./data/plassbdb is relative to the application's working directory:
# always use the same working directory to open the same database.
# It must be a different file from Ecoembes' database (./data/ecoembesdb).
spring.datasource.url=jdbc:h2:file:./data/plassbdb
spring.datasource.username=user
spring.datasource.password=password

spring.sql.init.platform=h2

# Enable H2 console in the browser in development mode (http://localhost:8081/h2-console).
spring.h2.console.enabled=true

# Project persistence: schema management (independent of the database URL).
# "update" preserves data and adjusts the schema to the entities where possible;
# it cannot handle every model change or prevent duplicate insertions.
# "create-drop" recreates tables at startup and drops them at shutdown:
# data is lost between runs EVEN when using a "file:" database.
# Reserve it for tests or demonstrations using a separate database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Logging message pattern
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%-35.35logger{0}){cyan} : %msg%n

# The simulated plant (used by DataInitializer and PlantService)
plassb.plant.id=1
plassb.plant.name=PlasSB Ecoplanta
plassb.plant.capacity=85